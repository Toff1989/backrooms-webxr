# Backrooms VR (fiche projet étape 8). Usage local / VPS générique :
#   docker compose up -d --build
#
# Sur Plesk : voir docs/DEPLOIEMENT-PLESK.md — hébergement recommandé via l'extension
# Node.js Toolkit de Plesk (Phusion Passenger), sans Docker. Ce docker-compose.yml reste
# utile pour un VPS générique ou pour tester le build de prod en local.
#
# Sur un VPS sans Plesk : ajoutez un service Caddy devant celui-ci pour l'HTTPS
# automatique (fiche projet : "Caddy ou Nginx + Let's Encrypt").
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      DB_PATH: "/app/server/data/backrooms.sqlite"
      # Obligatoire en production : secret HMAC des tokens de run (voir server/src/token.ts).
      # `openssl rand -hex 32` pour en générer un ; ne jamais committer sa vraie valeur.
      RUN_TOKEN_SECRET: ${RUN_TOKEN_SECRET:?définir RUN_TOKEN_SECRET (voir .env.example)}
    volumes:
      - backrooms-data:/app/server/data
    restart: unless-stopped

volumes:
  backrooms-data:
