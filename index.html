<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>Backrooms VR</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
      }
      #options-panel {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10;
        color: #e8e8e8;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 6px;
        padding: 10px 14px;
        font-size: 13px;
        line-height: 1.6;
        user-select: none;
      }
      #options-panel label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }
      #account-panel {
        user-select: text;
        margin-top: 6px;
        max-width: 260px;
      }
      #account-panel summary {
        cursor: pointer;
        font-weight: 600;
        opacity: 0.85;
      }
      #account-panel p {
        margin: 4px 0;
      }
      #account-panel .field-label {
        margin-top: 8px;
        opacity: 0.75;
      }
      #account-panel .field-row {
        display: flex;
        gap: 6px;
      }
      #account-panel input {
        flex: 1;
        min-width: 0;
        font: inherit;
        padding: 3px 6px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(0, 0, 0, 0.4);
        color: inherit;
      }
      #account-panel button {
        font: inherit;
        padding: 3px 10px;
        border-radius: 4px;
        border: 1px solid rgba(255, 226, 150, 0.5);
        background: rgba(255, 226, 150, 0.12);
        color: inherit;
        cursor: pointer;
      }
      #pair-start {
        margin-top: 8px;
      }
      #pair-code {
        font-weight: 600;
        color: #ffe89a;
      }
      #options-panel h1 {
        font-size: 13px;
        margin: 0 0 6px;
        font-weight: 600;
        letter-spacing: 0.03em;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="options-panel">
      <h1 data-i18n="options.title">Options</h1>
      <label>
        <input type="checkbox" id="vignette-toggle" checked />
        <span data-i18n="options.vignette">Vignette de confort</span>
      </label>
      <label>
        <span data-i18n="options.language">Langue</span>
        <select id="language-select">
          <option value="fr">Français</option>
          <option value="en">English</option>
        </select>
      </label>
      <details id="account-panel">
        <summary data-i18n="account.title">Enregistrement</summary>
        <p><span data-i18n="account.code">Code de cassette :</span> <strong id="account-code">…</strong></p>
        <p class="field-label" data-i18n="account.restoreLabel">Récupérer un enregistrement</p>
        <div class="field-row">
          <input id="restore-input" placeholder="K7-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" />
          <button id="restore-button" type="button" data-i18n="account.restore">Récupérer</button>
        </div>
        <button id="pair-start" type="button" data-i18n="account.pairStart">Jumeler cet appareil</button>
        <p id="pair-code"></p>
        <p class="field-label" data-i18n="account.pairConfirmLabel">Confirmer un nouvel appareil</p>
        <div class="field-row">
          <input id="pair-input" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="off" />
          <button id="pair-confirm" type="button" data-i18n="account.pairConfirm">Confirmer</button>
        </div>
        <p id="account-status"></p>
      </details>
      <p id="build-id" style="margin: 8px 0 0; font-size: 11px; opacity: 0.6"></p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
