<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>Backrooms VR</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
      }
      #options-panel {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10;
        color: #e8e8e8;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 6px;
        padding: 10px 14px;
        font-size: 13px;
        line-height: 1.6;
        user-select: none;
      }
      #options-panel label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }
      #options-panel h1 {
        font-size: 13px;
        margin: 0 0 6px;
        font-weight: 600;
        letter-spacing: 0.03em;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="options-panel">
      <h1 data-i18n="options.title">Options</h1>
      <label>
        <input type="checkbox" id="vignette-toggle" checked />
        <span data-i18n="options.vignette">Vignette de confort</span>
      </label>
      <label>
        <span data-i18n="options.language">Langue</span>
        <select id="language-select">
          <option value="fr">Français</option>
          <option value="en">English</option>
        </select>
      </label>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
